[tool.pytest.ini_options]
# Tests live in backend/tests/. Run from the repo root so the
# `backend.*` package imports resolve identically to production.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:starlette.*",
]
